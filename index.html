<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="upper-header">
            <div class="search">
                <img src="" alt="Search Icon">
                <input type="text" name="search" id="search">
            </div>
            <div class="right-upper-header">
                <img src="" alt="notification bell icon">
                <img src="" alt="profile image">
                <p>Morgan Oakley</p>
            </div>
        </div>
        <div class="lower-header">
            <div class="left-lower-header">
                <img src="" alt="profile image">
                <div class="user-info">
                    <p>Hi there,</p>
                    <h1>Morgan Oakley (@morgan)</h1>
                </div>
            </div>
            <div class="right-lower-header">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
    </header>
    <nav>
        <div class="logo">
            <img src="" alt="Site Icon">
            <p>Dashboard</p>
        </div>
        <div class="main-links">
            <ul>
                <li><img src="" alt="Home Icon">Home</li>
                <li><img src="" alt="Profile Icon">Profile</li>
                <li><img src="" alt="Messages Icon">Messages</li>
                <li><img src="" alt="History Icon">History</li>
                <li><img src="" alt="Tasks Icon">Tasks</li>
                <li><img src="" alt="Communities Icon">Communities</li>
            </ul>
        </div>
        <div class="secondary-links">
            <ul>
                <li><img src="" alt="Settings Icon">Settings</li>
                <li><img src="" alt="Support Icon">Support</li>
                <li><img src="" alt="Privacy Icon">Privacy</li>
            </ul>
        </div>
    </nav>
    <main>

    </main>
    <aside>

    </aside>
</body>
</html>
